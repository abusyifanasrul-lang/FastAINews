name: AI News Daily Pipeline

on:
  schedule:
    - cron: '0 8 * * *'   # setiap hari 08:00 UTC (15:00 WIB)
  workflow_dispatch:       # bisa di-run manual

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo -S -p '' apt-get update
          sudo -S -p '' apt-get install -y google-chrome-stable ffmpeg

      - name: Install npm dependencies
        run: npm install
        working-directory: ./bot

      - name: Run pipeline for content #15
        env:
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          npx tsx scripts/full-pipeline.ts --content-id=15
        working-directory: ./bot

      - name: Upload video artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: bot/content/
