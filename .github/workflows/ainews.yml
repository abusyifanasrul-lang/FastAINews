name: AI News Daily Pipeline

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      content_id:
        description: 'Content ID to process (revision or specific)'
        required: false
        type: string
      revision_note:
        description: 'Revision note for updating content'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable ffmpeg curl

      - name: Install npm dependencies
        run: npm install
        working-directory: ./

      - name: Cache OpenMontage vendor
        id: cache-vendor
        uses: actions/cache@v4
        with:
          path: vendor-openmontage
          key: vendor-openmontage-${{ runner.os }}-${{ hashFiles('scripts/fetch-openmontage.ts') }}
          restore-keys: |
            vendor-openmontage-${{ runner.os }}-

      - name: Fetch OpenMontage vendor (if cache miss)
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: npx tsx scripts/fetch-openmontage.ts

      - name: Install OpenMontage dependencies
        run: npm install --prefix vendor-openmontage

      - name: Add missing StatCard component
        run: |
          mkdir -p vendor-openmontage/src/components
          cat > vendor-openmontage/src/components/StatCard.tsx << 'EOF'
          import React from 'react';
          export const StatCard = ({ title, value, ...props }) => {
            return <div {...props}>{title}: {value}</div>;
          };
          EOF

      - name: Debug LLM endpoint (skipped to avoid 429)
        run: echo "LLM debug skipped"

      - name: Run pipeline (with retry)
        env:
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          REMOTION_BROWSER_EXECUTABLE: /usr/bin/google-chrome-stable
          CONTENT_ID: ${{ github.event.inputs.content_id }}
          REVISION_NOTE: ${{ github.event.inputs.revision_note }}
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            if [ -n "$CONTENT_ID" ] && [ -n "$REVISION_NOTE" ]; then
              npx tsx scripts/full-pipeline.ts --content-id="$CONTENT_ID" --revision-note="$REVISION_NOTE"
            elif [ -n "$CONTENT_ID" ]; then
              npx tsx scripts/full-pipeline.ts --content-id="$CONTENT_ID"
            else
              npx tsx scripts/full-pipeline.ts
            fi && exit 0
            echo "Attempt $attempt failed. Retrying in $((attempt*60)) seconds..."
            sleep $((attempt*60))
          done
          exit 1

      - name: Commit DB changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${REPO_PAT}@github.com/abusyifanasrul-lang/FastAINews.git"
          git add -f content/ainews.db
          git diff --staged --quiet || git commit -m "chore: update DB after pipeline [skip ci]"
          git push origin HEAD:master
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}

      - name: Upload video artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: content/