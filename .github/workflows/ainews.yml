name: AI News Daily Pipeline

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable ffmpeg curl

      - name: Install npm dependencies
        run: npm install
        working-directory: ./

      - name: Cache OpenMontage vendor
        id: cache-vendor
        uses: actions/cache@v4
        with:
          path: vendor-openmontage
          key: vendor-openmontage-${{ runner.os }}-${{ hashFiles('scripts/fetch-openmontage.ts') }}
          restore-keys: |
            vendor-openmontage-${{ runner.os }}-

      - name: Fetch OpenMontage vendor (if cache miss)
        if: steps.cache-vendor.outputs.cache-hit != 'true'
        run: npx tsx scripts/fetch-openmontage.ts

      - name: Install OpenMontage dependencies
        run: npm install --prefix vendor-openmontage

      - name: Debug LLM endpoint
        env:
          ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          API_KEY: ${{ secrets.LLM_API_KEY }}
          MODEL: ${{ secrets.LLM_MODEL }}
        run: |
          echo "ENDPOINT: ${ENDPOINT:0:30}..."
          set +e
          curl -s -w "\n%{http_code}" -X POST "${ENDPOINT}/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${API_KEY}" \
            -d "{\"model\":\"${MODEL}\",\"messages\":[{\"role\":\"user\",\"content\":\"test\"}],\"max_tokens\":5}" > /tmp/llm_test.out 2>&1
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "Curl failed with exit code $exit_code"
            cat /tmp/llm_test.out
            exit 1
          fi
          http_code=$(tail -n1 /tmp/llm_test.out)
          if [ "$http_code" != "200" ]; then
            echo "LLM endpoint returned HTTP $http_code"
            head -n -1 /tmp/llm_test.out | tail -n +2
            exit 1
          fi
          echo "LLM endpoint OK"

      - name: Run pipeline
        env:
          LLM_ENDPOINT: ${{ secrets.LLM_ENDPOINT }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: npx tsx scripts/full-pipeline.ts --content-id=15

      - name: Upload video artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: content/