name: AI News Long Assemble & Publish

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Tanggal edisi (YYYY-MM-DD)'
        required: true
        type: string
      gdrive_url:
        description: 'Link share file Google Drive (asset.zip berisi narration.mp3 + gambar .jpg)'
        required: true
        type: string

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ainews-long-assemble
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Install gdown + ffmpeg
        run: |
          pip install --quiet --break-system-packages gdown
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Assemble & Publish long video
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: npx tsx scripts/assemble-long.ts --date="${{ github.event.inputs.date }}" --gdrive-url="${{ github.event.inputs.gdrive_url }}"

      - name: Commit DB changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${REPO_PAT}@github.com/${{ github.repository }}.git"
          git add -f content/ainews.db
          git diff --staged --quiet || git commit -m "chore(long): hasil assemble & publish long-form [skip ci]"
          git push origin HEAD:master || true
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
