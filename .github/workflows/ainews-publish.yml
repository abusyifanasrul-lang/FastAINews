name: AI News Publish (Approve)

on:
  workflow_dispatch:
    inputs:
      content_id:
        description: 'Content ID to publish'
        required: true
        type: string
      video_file_id:
        description: 'Telegram video file_id (optional, bypass DB lookup)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Publish approved content
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
          CONTENT_ID: ${{ github.event.inputs.content_id }}
          VIDEO_FILE_ID: ${{ github.event.inputs.video_file_id }}
        run: npx tsx scripts/publish-approved.ts --content-id="$CONTENT_ID"
